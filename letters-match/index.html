<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#326c48" />
    <title>Letter Match · KiwiPlay</title>
    <link rel="icon" href="../shared/kiwi.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../shared/play.css?v=0fb132c41544" />
    <link rel="stylesheet" href="style.css?v=0fb132c41544" />
  </head>
  <body>
    <main class="main-menu" id="mainMenu">
      <header class="play-header">
        <a href="../" class="brand"
          ><img
            src="../shared/kiwi.svg"
            width="36"
            height="36"
            alt=""
          />KiwiPlay</a
        >
        <button
          class="control sound-control"
          data-sound
          type="button"
          aria-label="Turn sound off"
        ></button>
      </header>
      <div class="menu-heading">
          <a class="control kiosk-home" href="../" aria-label="Choose a game">←</a><h1 data-i18n>Letter Match</h1></div>
      <div class="letter-settings">
        <div
          class="choice-row alphabet-switch"
          id="langSelector"
          role="group"
          aria-label="Alphabet and pronunciation"
        >
          <button
            class="lang-btn"
            type="button"
            data-lang="en"
            aria-label="English alphabet and pronunciation"
          >
            EN
          </button>
          <button
            class="lang-btn"
            type="button"
            data-lang="pl"
            aria-label="Polish alphabet and pronunciation"
          >
            PL
          </button>
        </div>
        <div class="style-switch" role="group" aria-label="Letter style">
          <button type="button" data-font="serif" aria-label="Printed letters">
            <span class="style-example print" aria-hidden="true">Aa</span>
          </button>
          <button
            type="button"
            data-font="hand"
            aria-label="Handwritten letters"
          >
            <span class="style-example hand" aria-hidden="true">Aa</span>
          </button>
          <button
            type="button"
            data-font="default"
            aria-label="Letter style follows the level"
          >
            <span class="style-example" aria-hidden="true"
              >A<span class="hand">a</span></span>
          </button>
        </div>
      </div>
      <div class="level-grid" aria-label="Choose a level">
        <button class="level-card" data-level="easy" aria-label="Level 1">
          <span class="level-number" aria-hidden="true">1</span
          ><span class="level-example" aria-hidden="true">Oo</span>
        </button>
        <button class="level-card" data-level="medium" aria-label="Level 2">
          <span class="level-number" aria-hidden="true">2</span
          ><span class="level-example" aria-hidden="true">Aa</span>
        </button>
        <button class="level-card" data-level="hard" aria-label="Level 3">
          <span class="level-number" aria-hidden="true">3</span
          ><span class="level-example" aria-hidden="true">Rr</span>
        </button>
        <button class="level-card" data-level="fun" aria-label="Level 4">
          <span class="level-number" aria-hidden="true">4</span
          ><span class="level-example hand" aria-hidden="true">Bb</span>
        </button>
        <button class="level-card" data-level="mixed" aria-label="Level 5">
          <span class="level-number" aria-hidden="true">5</span
          ><span class="level-example hand" aria-hidden="true">Mm</span>
        </button>
        <button class="level-card" data-level="wild" aria-label="Level 6">
          <span class="level-number" aria-hidden="true">6</span
          ><span class="level-example" aria-hidden="true">Zz</span>
        </button>
        <button
          class="level-card infinite"
          data-level="infinite"
          aria-label="Endless mode"
        >
          <span class="infinity" aria-hidden="true">∞</span>
        </button>
      </div>
      <footer class="play-footer"><a href="../privacy.html">Privacy</a></footer>
    </main>
    <section
      class="game-screen hidden"
      id="gameScreen"
      aria-label="Letter matching game"
    >
      <header class="game-toolbar">
        <button class="control" id="backBtn" aria-label="Back to menu">
          ←
        </button>
        <span class="game-label score-display"
          ><span id="score">0</span> / <span id="roundTotal">10</span></span
        >
        <div class="game-controls">
          <details class="in-game-style">
            <summary class="control" aria-label="Letter style">Aa</summary>
            <div
              class="style-switch style-popover"
              role="group"
              aria-label="Letter style"
            >
              <button
                type="button"
                data-font="serif"
                aria-label="Printed letters"
              >
                <span class="style-example" aria-hidden="true">Aa</span>
              </button>
              <button
                type="button"
                data-font="hand"
                aria-label="Handwritten letters"
              >
                <span class="style-example hand" aria-hidden="true">Aa</span>
              </button>
              <button
                type="button"
                data-font="default"
                aria-label="Letter style follows the level"
              >
                <span class="style-example" aria-hidden="true"
                  >A<span class="hand">a</span></span>
              </button>
            </div>
          </details>
          <button
            class="control sound-control"
            data-sound
            type="button"
            aria-label="Turn sound off"
          ></button>
        </div>
      </header>
      <div class="progress" aria-hidden="true">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div class="game-area">
        <button
          class="target-letter"
          id="target"
          aria-label="Hear the letter"
        ></button>
        <p class="sr-only" id="roundHint" role="status">
          Find the matching letter
        </p>
        <div class="match-arrow" aria-hidden="true">↓</div>
        <div
          class="cards-container"
          id="cards"
          aria-label="Choose the matching letter"
        ></div>
      </div>
    </section>
    <dialog id="popup" aria-labelledby="popupTitle">
      <div class="celebration" aria-hidden="true">★</div>
      <h2 class="sr-only" id="popupTitle" data-i18n>Level complete</h2>
      <p id="popupScore" class="sr-only"></p>
      <div class="dialog-actions">
        <button class="secondary" id="popupBack" aria-label="Back to menu">
          ←</button
        ><button class="primary" id="popupNext" aria-label="Next level">
          →
        </button>
      </div>
    </dialog>
    <script src="../shared/context.js?v=0fb132c41544"></script>
    <script src="../shared/play.js?v=0fb132c41544"></script>
    <script src="settings.js?v=0fb132c41544"></script>
    <script src="letters.js?v=0fb132c41544"></script>
    <script src="game.js?v=0fb132c41544"></script>
  </body>
</html>
