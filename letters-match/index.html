<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="https://play.kiwiprojekt.pl" class="menu-back-btn">🥝 KiwiPlay</a>

  <div class="top-controls" id="topControls">
    <div class="lang-selector" id="langSelector">
      <button class="lang-btn" data-lang="en" aria-label="English">EN</button>
      <button class="lang-btn" data-lang="pl" aria-label="Polski">PL</button>
    </div>
    <button id="fontBtnMenu" class="font-btn" type="button" aria-label="Font style" title="Font: Level Default (Serifs / Hand / Mixed)">✍️</button>
    <button id="muteBtnMenu" class="mute-btn" type="button" aria-label="Mute audio" title="Sound: On">🔊</button>
  </div>

  <!-- Main Menu -->
  <div class="main-menu" id="mainMenu">
    <h1 class="menu-title">Letter Match</h1>
    <div class="level-grid">
      <div class="level-card" data-level="easy" role="button" tabindex="0" aria-label="Level 1">
        <div class="level-card-title">1</div>
      </div>
      <div class="level-card" data-level="medium" role="button" tabindex="0" aria-label="Level 2">
        <div class="level-card-title">2</div>
      </div>
      <div class="level-card" data-level="hard" role="button" tabindex="0" aria-label="Level 3">
        <div class="level-card-title">3</div>
      </div>
      <div class="level-card" data-level="fun" role="button" tabindex="0" aria-label="Level 4">
        <div class="level-card-title">4</div>
      </div>
      <div class="level-card" data-level="mixed" role="button" tabindex="0" aria-label="Level 5">
        <div class="level-card-title">5</div>
      </div>
      <div class="level-card" data-level="wild" role="button" tabindex="0" aria-label="Level 6">
        <div class="level-card-title">6</div>
      </div>
      <div class="level-card infinite" data-level="infinite" role="button" tabindex="0" aria-label="Infinite Mode">
        <div class="level-card-title">∞</div>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div class="game-screen hidden" id="gameScreen">
    <div class="header">
      <button class="back-btn" id="backBtn" aria-label="Back to menu">← Menu</button>
      <div class="score-display">
        <span class="score-label">Score:</span>
        <span id="score">0</span>
      </div>
      <div class="game-controls">
        <button id="fontBtn" class="font-btn" type="button" aria-label="Font style" title="Font: Level Default (Serifs / Hand / Mixed)">✍️</button>
        <button id="muteBtn" class="mute-btn" type="button" aria-label="Mute audio" title="Sound: On">🔊</button>
      </div>
    </div>

    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="game-area">
      <div class="target-letter" id="target"></div>
      <div class="cards-container" id="cards"></div>
    </div>
  </div>

  <!-- Level Complete Popup -->
  <div class="popup-overlay" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup-content">
      <h2 class="popup-title" id="popupTitle">Great Job!</h2>
      <div class="popup-score" id="popupScore"></div>
      <div class="popup-buttons">
        <button class="popup-btn back" id="popupBack">← Back</button>
        <button class="popup-btn next" id="popupNext">Next →</button>
      </div>
    </div>
  </div>

  <div id="confettiContainer" class="confetti-container" aria-hidden="true"></div>

  <footer class="game-footer">
    <a href="/privacy.html" style="color: var(--color-5); text-decoration: underline; font-weight: 700;">Privacy Policy</a>
  </footer>

  <script src="settings.js"></script>
  <script src="game.js"></script>
</body>
</html>
