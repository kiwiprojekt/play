<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a href="https://play.kiwiprojekt.pl" class="menu-back-btn">🥝 KiwiPlay</a>

  <div class="lang-selector" id="langSelector">
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="pl">PL</button>
  </div>

  <!-- Main Menu -->
  <div class="main-menu" id="mainMenu">
    <h1 class="menu-title">Letter Match</h1>
    <div class="level-grid">
      <div class="level-card" data-level="easy">
        <div class="level-card-title">1</div>
      </div>
      <div class="level-card" data-level="medium">
        <div class="level-card-title">2</div>
      </div>
      <div class="level-card" data-level="hard">
        <div class="level-card-title">3</div>
      </div>
      <div class="level-card" data-level="fun">
        <div class="level-card-title">4</div>
      </div>
      <div class="level-card" data-level="mixed">
        <div class="level-card-title">5</div>
      </div>
      <div class="level-card" data-level="wild">
        <div class="level-card-title">6</div>
      </div>
      <div class="level-card infinite" data-level="infinite">
        <div class="level-card-title">∞</div>
      </div>
    </div>
  </div>

  <!-- Game Screen -->
  <div class="game-screen hidden" id="gameScreen">
    <div class="header">
      <button class="back-btn" id="backBtn">← Menu</button>
      <div class="score-display">
        <span class="score-label">Score:</span>
        <span id="score">0</span>
      </div>
    </div>

    <div class="progress">
      <div class="progress-fill" id="progress"></div>
    </div>
    
    <div class="controls-bar">
      <button id="muteBtn" class="mute-btn">🔊</button>
    </div>

    <div class="game-area">
      <div class="target-letter" id="target"></div>
      <div class="cards-container" id="cards"></div>
    </div>
  </div>

  <!-- Level Complete Popup -->
  <div class="popup-overlay" id="popup">
    <div class="popup-content">
      <h2 class="popup-title">Great Job!</h2>
      <div class="popup-buttons">
        <button class="popup-btn back" id="popupBack">← Back</button>
        <button class="popup-btn next" id="popupNext">Next →</button>
      </div>
    </div>
  </div>

  <footer class="game-footer">
    <a href="/privacy.html" style="color: var(--color-5); text-decoration: underline; font-weight: 700;">Privacy Policy</a>
  </footer>

  <script src="settings.js"></script>
  <script src="game.js"></script>
</body>
</html>
