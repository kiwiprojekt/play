<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#326c48" />
    <meta
      name="description"
      content="Memory, alphabet matching, and maze games for children."
    />
    <title>KiwiPlay</title>
    <link rel="stylesheet" href="shared/play.css?v=9bb229f928c7" />
    <link rel="stylesheet" href="style.css?v=9bb229f928c7" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="shared/kiwi.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="play-header">
      <a class="brand" href="./"
        ><img src="shared/kiwi.svg" width="36" height="36" alt="" />KiwiPlay</a
      >
    </header>
    <main class="home-main">
      <h1 class="sr-only" data-i18n>Games</h1>
      <section class="games" aria-label="Choose a game">
        <a class="game-card memory" href="memo/">
          <div class="game-art">
            <img
              src="memo/cover.webp"
              width="640"
              height="960"
              alt="Friendly characters from Memory Match"
              fetchpriority="high"
            />
          </div>
          <div class="game-card-content">
            <h2 data-i18n>Memory Match</h2>
            <span class="play-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
        <a class="game-card letters" href="letters-match/">
          <div class="game-art">
            <img
              src="letters-match/cover.webp"
              width="640"
              height="960"
              alt="Colorful letters from Letter Match"
            />
          </div>
          <div class="game-card-content">
            <h2 data-i18n>Letter Match</h2>
            <span class="play-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
        <a class="game-card space" href="space-maze/">
          <div class="game-art">
            <img
              src="space-maze/cover.webp"
              width="640"
              height="960"
              alt="A little rocket exploring space"
            />
          </div>
          <div class="game-card-content">
            <h2 data-i18n>Space Maze</h2>
            <span class="play-arrow" aria-hidden="true">↗</span>
          </div>
        </a>
      </section>
    </main>
    <footer class="play-footer">
      <a href="privacy.html">Privacy</a>
    </footer>
    <script src="shared/context.js?v=9bb229f928c7"></script>
    <script src="shared/play.js?v=9bb229f928c7"></script>
  </body>
</html>
