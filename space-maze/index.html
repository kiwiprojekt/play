<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Maze</title>
    <script src="js/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a2e;
            overflow: hidden;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        @font-face {
            font-family: 'sairaStencil';
            src: url('assets/fonts/SairaStencil/SairaStencil-Medium.ttf') format('truetype');
            font-display: block;
        }
        body {
            font-family: 'sairaStencil', sans-serif;
        }
        .privacy-link {
            position: absolute;
            bottom: 12px;
            right: 12px;
            color: #8888ff;
            text-decoration: underline;
            font-size: 14px;
            font-family: 'sairaStencil', sans-serif;
            opacity: 0.7;
            z-index: 1000;
            transition: opacity 0.2s;
        }
        .privacy-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <a href="/privacy.html" class="privacy-link">Privacy Policy</a>
    <script src="js/config.js"></script>
    <script src="js/mazeGenerator.js"></script>
    <script src="js/preload.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
