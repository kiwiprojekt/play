<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#326c48" />
    <title>Memory Match · KiwiPlay</title>
    <link rel="icon" href="../shared/kiwi.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../shared/play.css?v=0fb132c41544" />
    <link rel="stylesheet" href="styles.css?v=0fb132c41544" />
  </head>
  <body>
    <main class="app">
      <section id="mainScreen" class="screen active">
        <header class="play-header">
          <a href="../" class="brand"
            ><img
              src="../shared/kiwi.svg"
              width="36"
              height="36"
              alt=""
            />KiwiPlay</a
          >
          <button
            id="muteButtonMenu"
            class="control sound-control"
            data-sound
            type="button"
            aria-label="Turn sound off"
          ></button>
        </header>
        <div class="menu-heading">
          <a class="control kiosk-home" href="../" aria-label="Choose a game">←</a>
          <h1 data-i18n>Memory Match</h1>
        </div>
        <div class="choice-row" aria-label="How many pairs?">
          <button type="button" data-pairs="3" aria-pressed="false" data-i18n>
            3 pairs
          </button>
          <button type="button" data-pairs="6" aria-pressed="false" data-i18n>
            6 pairs
          </button>
          <button type="button" data-pairs="all" aria-pressed="true" data-i18n>
            All pairs
          </button>
        </div>
        <div class="level-grid">
          <button type="button" class="level-button" data-level="1"></button>
          <button type="button" class="level-button" data-level="2"></button>
          <button type="button" class="level-button" data-level="3"></button>
          <button type="button" class="level-button" data-level="4"></button>
        </div>
        <footer class="play-footer">
          <a href="../privacy.html">Privacy</a>
        </footer>
      </section>
      <section id="gameScreen" class="screen">
        <header class="game-toolbar">
          <button
            id="backButton"
            class="control"
            type="button"
            aria-label="Back to menu"
          >
            ←
          </button>
          <div id="levelLabel" class="game-label">Transportation</div>
          <button
            id="muteButton"
            class="control sound-control"
            data-sound
            type="button"
            aria-label="Turn sound off"
          ></button>
        </header>
        <p id="matchProgress" class="match-progress" role="status">
          Find a pair
        </p>
        <div class="board-wrap">
          <section
            id="board"
            class="board"
            aria-label="Memory game board"
          ></section>
        </div>
      </section>
    </main>
    <dialog id="finishPopup" aria-labelledby="finishTitle">
      <div class="celebration" aria-hidden="true">✦</div>
      <h2 id="finishTitle" class="sr-only" data-i18n>All pairs found</h2>
      <div class="dialog-actions">
        <button
          id="exitButton"
          class="secondary"
          type="button"
          aria-label="Back to menu"
        >
          ←</button
        ><button
          id="replayButton"
          class="primary"
          type="button"
          aria-label="Play again"
        >
          ↻
        </button>
        <button id="nextButton" class="primary" type="button" aria-label="Next theme">→</button>
      </div>
    </dialog>
    <script src="../shared/context.js?v=0fb132c41544"></script>
    <script src="../shared/play.js?v=0fb132c41544"></script>
    <script src="script.js?v=0fb132c41544"></script>
  </body>
</html>
